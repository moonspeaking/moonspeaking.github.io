<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Загрузка реплея...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PT Sans', Arial, sans-serif;
    width: 100%; height: 100vh;
    overflow: hidden; background: #000;
  }
  #loading {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #000; z-index: 100;
  }
  .loader_window {
    display: flex; flex-direction: column;
    align-items: center; background: linear-gradient(180deg,#2a1f0e,#1a1208);
    border: 2px solid #c9a84c; border-radius: 8px;
    padding: 24px 48px; box-shadow: 0 0 30px rgba(201,168,76,0.3);
  }
  .info_head { color: #f0cf88; font-size: 18px; font-weight: bold; margin-bottom: 16px; }
  .loader { width: 48px; height: 48px; border: 4px solid #5a4020; border-top: 4px solid #c9a84c; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  #loading-text { color: #8a7a60; font-size: 13px; margin-top: 12px; }
</style>
<script>
  const params = new URLSearchParams(location.search);
  const warid = params.get('warid');
  if (warid) {
    location.href = '/Heroes/api/replay-proxy/' + warid;
  }
</script>
</head>
<body>
  <div id="loading">
    <div class="loader_window">
      <div class="info_head">Загрузка боя</div>
      <div class="loader"></div>
      <div id="loading-text">Перенаправление...</div>
    </div>
  </div>
</body>
</html>
