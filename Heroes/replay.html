<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Реплей боя — HeroesWM</title>
  <link href="https://fonts.googleapis.com/css?family=PT+Sans:400,700&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="./replay/styles.css">
</head>
<body>
  <div id="loading">
    <div class="window loader_window" style="display:flex">
      <div class="info_head">Загрузка боя</div>
      <div class="loader_container"><div class="loader"></div></div>
      <div id="loading-text"></div>
    </div>
  </div>

  <div id="combat_root" style="display:none">
    <div class="layout_container layout_container_V" id="layout_container">
      <div class="area_battlefield" id="area_battlefield">

        <div class="container" id="full_container" style="width:100%;height:100%">
          <div id="konva-container" style="width:100%;height:100%"></div>
        </div>

        <div class="toolbars toolbar_TopLeft" id="left_button">
          <div class="toolbars_img" id="btn-back" title="Назад">
            <img src="/Heroes/web/img/buttons/btn_backward.png" alt="Back">
          </div>
          <div class="toolbars_img" id="btn-pause" title="Пауза/Воспроизведение (Space)">
            <img src="/Heroes/web/img/buttons/btn_pause.png" id="img-pause">
            <img src="/Heroes/web/img/buttons/btn_play.png" id="img-play" style="display:none">
          </div>
          <div class="toolbars_img" id="btn-speed" title="Скорость (+/-)">
            <img src="/Heroes/web/img/buttons/btn_play_1.png" id="img-speed">
          </div>
          <div class="toolbars_img" id="btn-info" title="Статистика (I)">
            <img src="/Heroes/web/img/buttons/btn_info.png">
          </div>

        </div>

        <div class="war_creatures_container" id="war_creatures_container">
          <div class="war_hero_info_left" id="war_hero_info_left"></div>
          <div class="war_hero_info_right" id="war_hero_info_right"></div>
        </div>

        <div class="battle-log-panel" id="battle-log-panel">
          <div class="log-header">
            <span>Лог боя</span>
            <span class="log-close" onclick="document.getElementById('battle-log-panel').classList.remove('log-open')">&times;</span>
          </div>
          <div class="log-list" id="battle-log"></div>
        </div>

        <div id="combat-msg"></div>
        <div id="speed-indicator" class="speed-hide">x1</div>
        <div id="unit-tooltip" class="unit-tooltip" style="display:none"></div>
        <div id="battle-result" class="battle-result" style="display:none">
          <div class="br-content">
            <div class="br-title">Бой завершён</div>
            <div class="br-text" id="br-text"></div>
            <div class="br-actions">
              <button onclick="location.reload()">Повтор</button>
              <button onclick="history.back()">Назад</button>
            </div>
          </div>
        </div>
        <div id="unit-info" class="unit-info" style="display:none">
          <div class="ui-content">
            <div class="ui-header">
              <span class="ui-title" id="ui-title">Юнит</span>
              <span class="ui-close" onclick="closeUnitInfo()">&times;</span>
            </div>
            <div class="ui-body" id="ui-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/Heroes/js/konva.js"></script>
  <script type="module" src="./replay/app.js"></script>
</body>
</html>
