<!doctype html>
<!-- moonspeaking-heroes-root-404 — маркер: workflow узнаёт свой файл по нему и
не затирает чужой 404.html, лежащий в корне целевого репозитория. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #14171c; color: #d8d2c4;
         font: 16px/1.6 system-ui, sans-serif; text-align: center; }
  main { padding: 24px; }
  .code { font-size: 64px; font-weight: 700; margin: 0; color: #6b6355; }
  a { color: #e0b354; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <p>Страница не найдена.</p>
  <p><a href="/">На главную</a> · <a href="/Heroes/">Справочник Heroes</a></p>
</main>
<script>
// GitHub Pages отдаёт этот файл для любых 404 в пределах сайта: корневой
// источник публикации — целевой репозиторий, и лежащий в подпапке
// SPA-shell (Heroes/404.html) он не ищет. Если адрес внутри нашего сайта —
// подменяем документ на собранный shell: URL маршрута остаётся, и роутер
// basePath.ts показывает нужную страницу. Чужие пути оставляем как есть.
(function () {
  var BASE = '/Heroes/';
  if (BASE === '/' || location.pathname.indexOf(BASE) !== 0) return;
  // Петля возможна, если fetch вернёт этот же файл (страница не найдена —
  // GitHub отдаёт её и на 404.html): guard переживает document.open, окно то же.
  if (window.__heroesRoot404) return;
  window.__heroesRoot404 = true;
  fetch(BASE + '404.html', { credentials: 'same-origin' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.text();
    })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () { window.__heroesRoot404 = false; });
})();
</script>
<noscript>
  <p>JavaScript выключен. <a href="/Heroes/">Откройте справочник Heroes</a>.</p>
</noscript>
</body>
</html>
